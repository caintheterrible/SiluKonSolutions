<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-lg w-500 max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Sign up</h2>

    <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">
      <app-form-field
        label="Full Name"
        [control]="nameControl"
        type="text"
        placeholder=""
      ></app-form-field>

      <app-form-field
        label="Email"
        [control]="emailControl"
        type="email"
        placeholder=""
      ></app-form-field>

      <app-form-field
        label="Password"
        [control]="passwordControl"
        type="password"
        placeholder=""
      ></app-form-field>

      <app-form-field
        label="Company Name"
        [control]="companyNameControl"
        type="text"
        placeholder=""
      ></app-form-field>

      <div *ngIf="error" class="text-red-500 text-sm mb-4">{{error}}</div>
      <button
        type="submit"
        [disabled]="signupForm.invalid"
        class="cursor-pointer w-full mt-5 bg-indigo-700 text-white py-2 px-4 rounded-md hover:bg-indigo-600 focus:outline-none focus:ring-primary focus:ring-2 focus:ring-offset-2"
      >
        Sign up for free
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Already have an account? <a routerLink="/login" class="font-semibold text-blue-600 hover:underline cursor-pointer">Login</a>
    </p>

  </div>
</div>
