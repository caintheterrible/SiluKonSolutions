<div class="min-h-screen flex items-center justify-center bg-gray-100">
  <div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-6">Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <app-form-field
        label="Email"
        [control]="emailControl"
        type="email"
        placeholder=""
        ></app-form-field>
      <app-form-field
        label="Password"
        [control]="passwordControl"
        type="password"
        placeholder=""
        ></app-form-field>

      <div *ngIf="error" class="text-red-500 text-sm mb-4">{{error}}</div>
      <button
        type="submit"
        [disabled]="loginForm.invalid"
        class="cursor-pointer w-full mt-5 bg-indigo-700 text-white py-2 px-4 rounded-md hover:bg-indigo-600 focus:outline-none focus:ring-primary focus:ring-2 focus:ring-offset-2"
      >
        Login
      </button>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Don't have an account? <a routerLink="/signup" class="font-semibold text-blue-600 hover:underline cursor-pointer">Sign up for free</a>
    </p>

  </div>
</div>
