<div class="mb-4">
  <label class="block text-sm font-medium text-gray-700">{{label}}</label>
  <input
    [type]="type"
    [formControl]="control"
    [placeholder]="placeholder"
    class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-primary focus:border-primary sm:text-sm"
    [ngClass]="{
      'border-red-500': control.invalid && (control.dirty || control.touched)
    }"
    />

  <div
    *ngIf="control.invalid && (control.dirty || control.touched)"
    class="text-red-500 text-sm mt-1"
  >
    <span *ngIf="control.errors?.['required']">{{label}} is required</span>
    <span *ngIf="control.errors?.['email']">Invalid email format</span>
    <span *ngIf="control.errors?.['minlength']">Minimum length is {{control.errors?.['minlength'].requiredLength}}</span>
  </div>

</div>
